# Sable's tmux look. Loaded by the playground (`tmux -f`) and sourced from the
# ~/.tmux.conf that install.sh writes, so both look the same.
#
# The README palette in 256 colours: 235 bar, 141 accent, 240/245 muted text,
# 237 pane borders, 60 the active pane's edge. 256 rather than hex so it holds
# in terminals and tmux builds without truecolor.

set -g default-terminal "xterm-256color"
set -g status-position bottom
set -g status-interval 15
set -g status-style "bg=colour235,fg=colour245"

set -g status-left-length 20
set -g status-left "#[fg=colour141,bold] ◆ sable #[fg=colour238,nobold]│ "

# Windows: the shell and any task windows. The current one is bright.
set -g window-status-format         "#[fg=colour240] #W "
set -g window-status-current-format "#[fg=colour252,bold] #W "
set -g window-status-separator      ""

set -g status-right-length 50
set -g status-right "#[fg=colour240]#H #[fg=colour238]· #[fg=colour250]%H:%M "

set -g pane-border-lines single
set -g pane-border-style        "fg=colour237"
set -g pane-active-border-style "fg=colour60"

set -g message-style "bg=colour235,fg=colour252"
set -g mode-style    "bg=colour60,fg=colour255"
