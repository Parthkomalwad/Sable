<svg xmlns="http://www.w3.org/2000/svg" width="460" height="132" viewBox="0 0 460 132" role="img" aria-label="Sable — the shell that asks first">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F2FF"/><stop offset="1" stop-color="#E6E2FB"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B84F5"/><stop offset="1" stop-color="#6D4AEA"/>
    </linearGradient>
    <style>
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes draw{from{stroke-dashoffset:96}to{stroke-dashoffset:0}}
      @keyframes halo{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.06)}}
      #chev{stroke-dasharray:96;animation:draw 1.1s ease-out forwards}
      #cursor{animation:blink 1.05s step-end infinite}
      #glow{animation:halo 3.2s ease-in-out infinite;transform-origin:66px 66px}
      @media (prefers-reduced-motion:reduce){#chev{stroke-dashoffset:0;animation:none}#cursor,#glow{animation:none}}
    </style>
  </defs>
  <rect id="glow" x="6" y="6" width="120" height="120" rx="28" fill="#6D4AEA"/>
  <rect x="16" y="16" width="100" height="100" rx="23" fill="url(#tile)" stroke="#BFC8D4"/>
  <path id="chev" d="M48 44 L76 66 L48 88" fill="none" stroke="url(#ac)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect id="cursor" x="80" y="80" width="17" height="8" rx="2" fill="#6D4AEA"/>
  <text x="146" y="78" font-family="'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" font-size="60" font-weight="700" letter-spacing="-2" fill="#1C2430">sable</text>
  <text x="149" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.6" fill="#5C6775">THE SHELL THAT ASKS FIRST</text>
</svg>
