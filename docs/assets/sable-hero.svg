<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#121A24"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="880" height="300" rx="14"/></clipPath>
    <style>
      .dim{fill:#6B7783}.ink{fill:#D8DEE6}.p{fill:#A899FF}.g{fill:#5FCB7A}.a{fill:#E7B24B}.w{fill:#FFFFFF}
      .line{opacity:0}
      @keyframes show{to{opacity:1}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes type{from{width:0}to{width:100%}}
      #l1{animation:show .1s .3s forwards}
      #l2{animation:show .1s 1.6s forwards}
      #l3{animation:show .1s 2.1s forwards}
      #l4{animation:show .1s 3.0s forwards}
      #l5{animation:show .1s 3.9s forwards}
      #l6{animation:show .1s 4.4s forwards}
      #l7{animation:show .1s 5.4s forwards}
      #l8{animation:show .1s 6.6s forwards}
      #sb1{animation:show .1s 0s forwards}
      #sb2{animation:show .1s 5.5s forwards}
      #sb3{animation:show .1s 6.7s forwards}
      #caret{animation:blink 1s step-end infinite}
      #typed{overflow:hidden;white-space:nowrap;display:inline-block}
      @media (prefers-reduced-motion:reduce){.line,#sb1,#sb2,#sb3{opacity:1;animation:none}}
    </style>
  </defs>
  <rect width="880" height="300" rx="14" fill="url(#g)"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="880" height="30" fill="#0A0D12"/>
    <circle cx="18" cy="15" r="5" fill="#2C3541"/><circle cx="34" cy="15" r="5" fill="#2C3541"/><circle cx="50" cy="15" r="5" fill="#2C3541"/>
    <text x="70" y="19" class="dim" font-size="11">tmux · sable-parth · pane 0 + sidebar</text>
    <line x1="640" y1="30" x2="640" y2="300" stroke="#1F2730"/>

    <!-- prompt line with typing -->
    <text x="20" y="60" class="dim">~/api <tspan class="g">main ✓</tspan> <tspan class="dim">14:02</tspan> <tspan class="p">❯</tspan></text>
    <g id="l1" class="line">
      <text x="178" y="60" class="w">deploy the api and run the smoke tests</text>
    </g>
    <text id="caret" x="500" y="60" class="p">▌</text>

    <g id="l2" class="line"><text x="34" y="92" class="p">✦ <tspan class="ink">Using skill</tspan> <tspan class="w">deploy-backend</tspan> <tspan class="dim">(confidence 0.85)</tspan></text></g>
    <g id="l3" class="line"><text x="52" y="112" class="dim">Plan: build → migrate → restart → verify</text></g>
    <g id="l4" class="line"><text x="34" y="144" class="w">$ docker compose build api</text><text x="440" y="144" class="dim">34s · exit 0</text></g>
    <g id="l5" class="line"><text x="34" y="176" class="a">⚠ alembic upgrade head</text><text x="330" y="176" class="dim">touches DB · confirm</text></g>
    <g id="l6" class="line"><text x="52" y="196" class="dim">↵ run   e edit   d diff   q cancel  ›</text></g>
    <g id="l7" class="line"><text x="34" y="228" class="p">◈ <tspan class="ink">spawning agent:</tspan> <tspan class="w">smoke-tests</tspan> <tspan class="dim">→ task:smoke-tests</tspan></text></g>
    <g id="l8" class="line"><text x="34" y="260" class="g">✓ <tspan class="ink">done in 2m 11s</tspan> <tspan class="dim">· $0.004 · 1,930 tok</tspan></text></g>

    <!-- sidebar -->
    <g id="sb1" class="line" font-size="12">
      <text x="660" y="60" class="ink">✦ session</text>
      <text x="660" y="78" class="dim">claude-sonnet-5</text>
      <text x="660" y="94" class="dim">$0.41 today · 12 calls</text>
      <text x="660" y="130" class="ink">◈ agents</text>
      <text x="660" y="148" class="dim"><tspan class="g">●</tspan> orchestrator   run</text>
      <text x="660" y="200" class="ink">⎇ git</text>
      <text x="660" y="218" class="dim">main  +2 ~1</text>
      <text x="660" y="250" class="ink">⬡ system</text>
      <text x="660" y="268" class="dim">cpu 12%   ram 41%</text>
    </g>
    <g id="sb2" class="line" font-size="12"><text x="660" y="166" class="dim"><tspan class="g">●</tspan> smoke-tests    ▓▓░</text></g>
    <g id="sb3" class="line" font-size="12"><rect x="655" y="155" width="140" height="14" fill="#111923"/><text x="660" y="166" class="dim"><tspan class="g">●</tspan> smoke-tests    done ✓</text></g>
  </g>
</svg>
