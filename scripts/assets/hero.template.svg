<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="A Sable session: a goal typed in plain English is routed to an agent, a skill is matched, each command is previewed before it runs, a destructive command is gated behind the word YES, and long work is handed to a sandboxed sub-agent while a sidebar shows live cost and running agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="__BG0__"/>
      <stop offset="1" stop-color="__BG1__"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="__ACC__" stop-opacity="0"/>
      <stop offset=".5" stop-color="__ACC__" stop-opacity=".85"/>
      <stop offset="1" stop-color="__ACC__" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="900" height="420" rx="14"/></clipPath>
    <clipPath id="typeclip"><rect id="typebox" x="196" y="52" width="0" height="20"/></clipPath>
    <style>
      text{font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;font-size:13.5px}
      .dim{fill:__DIM__}.ink{fill:__INK__}.acc{fill:__ACC__}.ok{fill:__OK__}.warn{fill:__WARN__}.hi{fill:__HI__}
      .r{opacity:0;animation:in .35s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes type{from{width:0}to{width:330px}}
      @keyframes caret{0%{transform:translateX(0)}18%{transform:translateX(330px)}100%{transform:translateX(330px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes sweep{0%{transform:translateX(-260px)}100%{transform:translateX(900px)}}
      @keyframes grow{from{width:0}}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
      #typebox{animation:type 1.5s steps(38,end) .4s forwards}
      #caret{animation:caret 8.4s linear infinite,blink .9s step-end infinite}
      #spin{animation:spin 1s linear infinite;transform-origin:44px 230px}
      #sweepbar{animation:sweep 8.4s ease-in-out infinite}
      .bar{animation:grow 1.2s ease-out forwards}
      .dot{animation:pulse 1.6s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){
        .r{opacity:1;animation:none}
        #typebox{width:330px;animation:none}
        #caret,#spin,#sweepbar,.dot{animation:none}
        .bar{animation:none}
      }
    </style>
  </defs>

  <rect width="900" height="420" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="900" height="30" fill="__CHROME__"/>
    <circle cx="18" cy="15" r="5" fill="__DOT__"/><circle cx="34" cy="15" r="5" fill="__DOT__"/><circle cx="50" cy="15" r="5" fill="__DOT__"/>
    <text x="70" y="19" class="dim" font-size="11">tmux · sable@prod-api · pane 0 + sidebar</text>
    <rect id="sweepbar" x="0" y="29" width="260" height="1.5" fill="url(#sweep)"/>
    <line x1="648" y1="30" x2="648" y2="420" stroke="__RULE__"/>

    <text x="20" y="66" class="dim">~/api <tspan class="ok">main ✓</tspan> <tspan class="acc">❯</tspan></text>
    <g clip-path="url(#typeclip)"><text x="196" y="66" class="hi">deploy the api and run the smoke tests</text></g>
    <rect id="caret" x="196" y="54" width="8" height="15" fill="__ACC__"/>

    <g class="r" style="animation-delay:2.0s">
      <text x="34" y="94" class="dim">route <tspan class="acc">language</tspan> · confidence 0.94 · skill <tspan class="hi">deploy-backend</tspan></text>
    </g>

    <g class="r" style="animation-delay:2.6s">
      <text x="34" y="124" class="acc">✦ <tspan class="ink">Build the image, migrate, then restart the unit</tspan></text>
    </g>
    <g class="r" style="animation-delay:3.0s">
      <text x="34" y="148" class="ok">$ <tspan class="hi">docker build -t api:9f2c1ab .</tspan></text>
      <text x="48" y="170" class="dim">↵ run   e edit   q cancel  ›</text>
    </g>
    <g class="r" style="animation-delay:4.0s">
      <text x="34" y="194" class="ok">✓ <tspan class="dim">0 · 12.4s · built sha 9f2c1ab</tspan></text>
    </g>

    <g class="r" style="animation-delay:4.6s">
      <rect x="30" y="206" width="596" height="46" rx="7" fill="__WARNBG__" stroke="__WARN__" stroke-opacity=".5"/>
      <g id="spin"><path d="M44 224 a6 6 0 1 1 -4.2 1.8" fill="none" stroke="__WARN__" stroke-width="2" stroke-linecap="round"/></g>
      <text x="60" y="228" class="warn">⚠ DESTRUCTIVE <tspan class="hi">docker system prune -af</tspan></text>
      <text x="60" y="245" class="dim">Type YES to run, anything else cancels ›<tspan class="hi"> YES</tspan></text>
    </g>

    <g class="r" style="animation-delay:5.6s">
      <text x="34" y="278" class="acc">◈ <tspan class="ink">smoke suite exceeded 120s — delegating to a sandboxed sub-agent</tspan></text>
      <text x="48" y="300" class="dim">tmux window <tspan class="hi">task:smoke-suite-0920</tspan> · bwrap · workspace rw, rest ro</text>
    </g>
    <g class="r" style="animation-delay:6.4s">
      <text x="20" y="332" class="dim">~/api <tspan class="ok">main ✓</tspan> <tspan class="acc">❯</tspan> <tspan class="dim">you keep your prompt</tspan></text>
    </g>

    <text x="668" y="56" class="dim" font-size="10.5" letter-spacing="1.6">SESSION</text>
    <g class="r" style="animation-delay:.2s">
      <text x="668" y="78" class="ink">cost <tspan class="hi">$0.0142</tspan></text>
      <text x="668" y="96" class="dim" font-size="11">11.2k in · 1.9k out</text>
      <rect x="668" y="104" width="212" height="4" rx="2" fill="__RULE__"/>
      <rect class="bar" x="668" y="104" width="88" height="4" rx="2" fill="__ACC__" style="animation-delay:.6s"/>
    </g>

    <text x="668" y="136" class="dim" font-size="10.5" letter-spacing="1.6">AGENTS</text>
    <g class="r" style="animation-delay:5.8s">
      <circle class="dot" cx="672" cy="153" r="3.5" fill="__OK__"/>
      <text x="684" y="157" class="ink" font-size="12">smoke-suite-0920</text>
      <text x="684" y="173" class="dim" font-size="11">running · step 2/4</text>
    </g>
    <g class="r" style="animation-delay:6.0s">
      <circle cx="672" cy="193" r="3.5" fill="__DIM__"/>
      <text x="684" y="197" class="dim" font-size="12">migrate-db-0919</text>
      <text x="684" y="213" class="dim" font-size="11">done · 4 steps · 38s</text>
    </g>

    <text x="668" y="246" class="dim" font-size="10.5" letter-spacing="1.6">SYSTEM</text>
    <g class="r" style="animation-delay:.4s">
      <text x="668" y="266" class="dim" font-size="11">cpu</text>
      <rect x="704" y="258" width="176" height="4" rx="2" fill="__RULE__"/>
      <rect class="bar" x="704" y="258" width="62" height="4" rx="2" fill="__OK__" style="animation-delay:.8s"/>
      <text x="668" y="286" class="dim" font-size="11">mem</text>
      <rect x="704" y="278" width="176" height="4" rx="2" fill="__RULE__"/>
      <rect class="bar" x="704" y="278" width="118" height="4" rx="2" fill="__ACC__" style="animation-delay:.9s"/>
      <text x="668" y="306" class="dim" font-size="11">disk</text>
      <rect x="704" y="298" width="176" height="4" rx="2" fill="__RULE__"/>
      <rect class="bar" x="704" y="298" width="150" height="4" rx="2" fill="__WARN__" style="animation-delay:1s"/>
    </g>

    <text x="668" y="340" class="dim" font-size="10.5" letter-spacing="1.6">7-DAY TOKENS</text>
    <g class="r" style="animation-delay:.6s">
      <rect x="668" y="372" width="18" height="14" rx="2" fill="__ACC__" opacity=".35"/>
      <rect x="692" y="364" width="18" height="22" rx="2" fill="__ACC__" opacity=".45"/>
      <rect x="716" y="356" width="18" height="30" rx="2" fill="__ACC__" opacity=".55"/>
      <rect x="740" y="368" width="18" height="18" rx="2" fill="__ACC__" opacity=".65"/>
      <rect x="764" y="350" width="18" height="36" rx="2" fill="__ACC__" opacity=".75"/>
      <rect x="788" y="344" width="18" height="42" rx="2" fill="__ACC__" opacity=".85"/>
      <rect x="812" y="358" width="18" height="28" rx="2" fill="__ACC__"/>
    </g>

    <rect x="0.5" y="0.5" width="899" height="419" rx="14" fill="none" stroke="__RULE__"/>
  </g>
</svg>
