<svg xmlns="http://www.w3.org/2000/svg" width="460" height="132" viewBox="0 0 460 132" role="img" aria-label="Sable, your server's AI operator">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="__TILE0__"/><stop offset="1" stop-color="__TILE1__"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="__ACC2__"/><stop offset="1" stop-color="__ACC__"/>
    </linearGradient>
    <style>
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
      @keyframes draw{from{stroke-dashoffset:96}to{stroke-dashoffset:0}}
      @keyframes halo{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.06)}}
      #chev{stroke-dasharray:96;animation:draw 1.1s ease-out forwards}
      #cursor{animation:pulse 2.4s ease-in-out infinite}
      #glow{animation:halo 3.2s ease-in-out infinite;transform-origin:66px 66px}
      @media (prefers-reduced-motion:reduce){#chev{stroke-dashoffset:0;animation:none}#cursor,#glow{animation:none}}
    </style>
  </defs>
  <rect id="glow" x="6" y="6" width="120" height="120" rx="28" fill="__ACC__"/>
  <rect x="16" y="16" width="100" height="100" rx="23" fill="url(#tile)" stroke="__RULE2__"/>
  <g transform="translate(16 16) scale(0.390625)">
    <path id="chev" d="M62 60 L130 128 L62 196" fill="none" stroke="url(#ac)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" pathLength="96"/>
    <circle id="cursor" cx="184" cy="178" r="26" fill="__OK__"/>
  </g>
  <text x="146" y="78" font-family="'Segoe UI', 'Helvetica Neue', system-ui, sans-serif" font-size="60" font-weight="700" letter-spacing="-2" fill="__INK__">sable</text>
  <text x="149" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.6" fill="__DIM__">YOUR SERVER'S AI OPERATOR</text>
</svg>
