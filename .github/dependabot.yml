version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # pinned on purpose see CLAUDE.md approved-dependency list
      - dependency-name: tiktoken
      - dependency-name: libtmux
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
